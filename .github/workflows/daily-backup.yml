=== workflow 檔內容（待會複製貼上）===
name: AI News 每日備援觸發

# 備援機制：每天台北時間 08:35 ping Apps Script Web App。
# 若主觸發器（08:00）已成功，Web App 會偵測「今天已有資料」並跳過（冪等）；
# 只有當主觸發器失敗時，才會補跑完整 pipeline。

on:
  schedule:
    # UTC 00:35 = 台北 08:35（比主觸發器 08:00 晚 35 分鐘當備援）
    - cron: '35 0 * * *'
  workflow_dispatch:   # 也可在 GitHub Actions 頁面手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫 Apps Script 備援入口
        run: |
          URL="${{ secrets.BACKUP_WEBAPP_URL }}"
          TOKEN="${{ secrets.BACKUP_TOKEN }}"
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::error::BACKUP_WEBAPP_URL 或 BACKUP_TOKEN 未設定"
            exit 1
          fi
          echo "呼叫備援入口…"
          # Apps Script Web App 會 302 轉址，用 -L 跟隨
          RESP=$(curl -sL --max-time 600 "${URL}?token=${TOKEN}")
          echo "回應：$RESP"
          echo "$RESP" | grep -q '"ok":true' && echo "✅ 備援檢查完成" || (echo "::warning::備援回應異常"; exit 0)

