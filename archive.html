<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歷史封存｜AI News</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/common.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    body { font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .prose-cn { line-height: 1.8; letter-spacing: 0.02em; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">

  <div x-data="archiveApp()" x-init="init()" x-cloak class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">

    <!-- Header -->
    <header class="border-b border-slate-200 pb-6 mb-8">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
          歷史封存
          <span class="block text-sm font-normal text-slate-500 mt-1">瀏覽過去每一天的 AI 影音情報</span>
        </h1>
        <nav class="flex gap-3 text-sm">
          <a href="index.html" class="text-slate-600 hover:text-slate-900">今日</a>
          <a href="search.html" class="text-slate-600 hover:text-slate-900">搜尋</a>
        </nav>
      </div>
    </header>

    <!-- Loading -->
    <div x-show="loading" class="py-20 text-center text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-slate-300 border-t-slate-700 rounded-full animate-spin"></div>
      <p class="mt-3 text-sm">載入中⋯⋯</p>
    </div>

    <!-- Error -->
    <div x-show="error" class="py-12 px-6 bg-red-50 border border-red-200 rounded-lg">
      <h2 class="font-semibold text-red-800">資料載入失敗</h2>
      <p class="mt-2 text-sm text-red-700" x-text="error"></p>
      <button @click="init()" class="mt-4 text-sm px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">重試</button>
    </div>

    <!-- Empty -->
    <div x-show="!loading && !error && availableDates.length === 0" class="py-16 text-center">
      <p class="text-5xl mb-4">📭</p>
      <h2 class="text-lg font-semibold text-slate-700">尚無歷史資料</h2>
      <p class="mt-2 text-sm text-slate-500">Pipeline 跑過幾天之後這裡會慢慢累積。</p>
    </div>

    <main x-show="!loading && !error && availableDates.length > 0" class="space-y-8">

      <!-- 日期導覽列 -->
      <section class="bg-white border border-slate-200 rounded-xl p-4 sm:p-5 sticky top-2 z-10 shadow-sm">
        <div class="flex items-center gap-3">
          <button @click="goPrev()" :disabled="!hasPrev"
                  class="px-3 py-2 text-sm rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed">
            ← 前一日
          </button>

          <select x-model="selectedDate" @change="loadDate()"
                  class="flex-1 px-3 py-2 text-sm rounded border border-slate-200 bg-white">
            <template x-for="d in availableDates" :key="d">
              <option :value="d" x-text="displayDateFor(d)"></option>
            </template>
          </select>

          <button @click="goNext()" :disabled="!hasNext"
                  class="px-3 py-2 text-sm rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed">
            後一日 →
          </button>
        </div>
        <p class="mt-2 text-xs text-slate-500">
          目前共 <span x-text="availableDates.length"></span> 天的封存
          <span x-show="items.length > 0">· 本日 <span x-text="items.length"></span> 則</span>
        </p>
      </section>

      <!-- 該日內容 -->
      <div x-show="items.length === 0" class="py-12 text-center text-slate-400 text-sm">
        本日無內容
      </div>

      <!-- Top 3 -->
      <section x-show="topThree.length > 0">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>🚀</span><span>三大戰情點</span>
        </h2>
        <div class="space-y-4">
          <template x-for="item in topThree" :key="item.id">
            <article class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm">
              <div class="flex items-start justify-between gap-3 mb-3">
                <h3 class="font-bold text-lg leading-snug">
                  <span class="inline-block text-xs font-medium px-2 py-0.5 rounded mr-2 align-middle"
                        :class="categoryClass(item.category)"
                        x-text="`【${item.category}】`"></span>
                  <span x-text="item.title"></span>
                </h3>
                <span class="shrink-0 text-xs text-amber-600 font-semibold" x-text="'★ ' + item.score.toFixed(1)"></span>
              </div>
              <dl class="prose-cn text-sm space-y-2 text-slate-700">
                <div><dt class="inline font-semibold text-slate-900">一秒看懂：</dt><dd class="inline" x-text="item.one_line"></dd></div>
                <div><dt class="inline font-semibold text-slate-900">為什麼重要：</dt><dd class="inline" x-text="item.key_takeaway"></dd></div>
                <div><dt class="inline font-semibold text-slate-900">行動：</dt><dd class="inline" x-text="item.actionable"></dd></div>
              </dl>
              <div class="mt-4 text-xs">
                <a :href="item.source_url" target="_blank" rel="noopener" class="text-blue-600 hover:underline">原文 →</a>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- 其他 -->
      <section x-show="others.length > 0">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>🛠️</span><span>其他內容</span>
        </h2>
        <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <template x-for="item in others" :key="item.id">
            <details class="border-b border-slate-100 last:border-b-0 group">
              <summary class="px-5 py-4 cursor-pointer hover:bg-slate-50 flex items-center gap-3">
                <span class="text-xs font-medium px-2 py-0.5 rounded shrink-0"
                      :class="categoryClass(item.category)" x-text="item.category"></span>
                <span class="font-medium text-sm flex-1 truncate" x-text="item.title"></span>
                <span class="text-xs text-amber-600 shrink-0" x-text="'★' + item.score.toFixed(1)"></span>
              </summary>
              <div class="px-5 pb-4 prose-cn text-sm text-slate-700 space-y-2">
                <p x-text="item.one_line"></p>
                <p class="text-slate-600" x-text="item.key_takeaway"></p>
                <p><span class="font-semibold">行動：</span><span x-text="item.actionable"></span></p>
                <a :href="item.source_url" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline">原文 →</a>
              </div>
            </details>
          </template>
        </div>
      </section>

      <!-- Shary 觀點 -->
      <section x-show="sharyVoice">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>✍️</span><span>Shary 觀點</span>
        </h2>
        <blockquote class="bg-slate-900 text-slate-100 rounded-xl p-6 prose-cn leading-relaxed">
          <p x-text="sharyVoice"></p>
          <footer class="mt-4 text-xs text-slate-400 text-right">— Shary｜影音創客創辦人</footer>
        </blockquote>
      </section>

    </main>

    <footer class="mt-16 pt-6 border-t border-slate-200 text-xs text-slate-400 text-center">
      <p>AI News｜歷史封存</p>
    </footer>

  </div>

  <script>
    function archiveApp() {
      return {
        loading: true,
        error: null,
        allNews: [],
        allShary: [],
        availableDates: [],
        selectedDate: '',
        items: [],
        sharyVoice: '',
        categoryClass,
        displayDateFor: displayDate,

        get topThree() {
          return this.items
            .filter(i => String(i.is_top).toLowerCase() === 'true' || i.is_top === true)
            .sort((a, b) => b.score - a.score)
            .slice(0, 3);
        },
        get others() {
          const topIds = new Set(this.topThree.map(i => i.id));
          return this.items.filter(i => !topIds.has(i.id))
            .sort((a, b) => b.score - a.score);
        },
        get hasPrev() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          return idx >= 0 && idx < this.availableDates.length - 1;
        },
        get hasNext() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          return idx > 0;
        },

        async init() {
          this.loading = true;
          this.error = null;
          try {
            const [news, shary] = await Promise.all([
              fetchSheet(AI_NEWS_CONFIG.SHEETS.NEWS),
              fetchSheet(AI_NEWS_CONFIG.SHEETS.SHARY)
            ]);
            this.allNews = news;
            this.allShary = shary;

            // 取所有有資料的日期，由新到舊排序
            const dateSet = new Set(news.map(n => n.date).filter(Boolean));
            this.availableDates = [...dateSet].sort((a, b) => b.localeCompare(a));

            // 預設選擇 URL hash 或最新日期
            const hashDate = (location.hash || '').replace('#', '');
            if (hashDate && this.availableDates.includes(hashDate)) {
              this.selectedDate = hashDate;
            } else if (this.availableDates.length > 0) {
              this.selectedDate = this.availableDates[0];
            }
            this.loadDate();
          } catch (err) {
            console.error(err);
            this.error = err.message || '未知錯誤';
          } finally {
            this.loading = false;
          }
        },

        loadDate() {
          this.items = this.allNews.filter(n => n.date === this.selectedDate);
          const s = this.allShary.find(s => s.date === this.selectedDate);
          this.sharyVoice = s ? s.content : '';
          history.replaceState(null, '', '#' + this.selectedDate);
        },

        goPrev() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          if (idx >= 0 && idx < this.availableDates.length - 1) {
            this.selectedDate = this.availableDates[idx + 1];
            this.loadDate();
          }
        },
        goNext() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          if (idx > 0) {
            this.selectedDate = this.availableDates[idx - 1];
            this.loadDate();
          }
        }
      };
    }
  </script>
</body>
</html>
