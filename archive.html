<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歷史封存｜AI News</title>

  <link rel="stylesheet" href="assets/style.css?v=20260605r">
  <script src="assets/common.js?v=20260605r"></script>
  <script src="assets/quotes.js?v=20260605r"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>
</head>

<body>

  <script>document.write(renderHeader('archive'));</script>

  <div x-data="archiveApp()" x-init="init()" x-cloak class="container">

    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0.5rem;margin-bottom:2rem">
      <div>
        <h1 style="margin:0;font-size:2rem;font-weight:900;letter-spacing:-0.02em">歷史封存</h1>
        <p style="margin:0.35rem 0 0;color:var(--ink-soft);font-size:0.9rem">瀏覽過去每一天的 AI 影音情報</p>
      </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="state-box">
      <div class="spinner"></div>
      <p style="margin-top:0.85rem;font-size:0.875rem">載入中⋯⋯</p>
    </div>

    <div x-show="error" class="error-box">
      <h2 style="margin:0 0 0.5rem;font-size:1rem;font-weight:800">資料載入失敗</h2>
      <p style="margin:0" x-text="error"></p>
      <button @click="init()" style="margin-top:0.85rem;padding:0.5rem 1rem;background:#DC2626;color:#fff;border:0;border-radius:0.4rem;cursor:pointer;font-weight:700">重試</button>
    </div>

    <div x-show="!loading && !error && availableDates.length === 0" class="state-box">
      <p class="emoji">📭</p>
      <h2 style="font-size:1.1rem;font-weight:800;color:var(--ink)">尚無歷史資料</h2>
      <p style="margin-top:0.4rem">Pipeline 跑過幾天之後這裡會慢慢累積。</p>
    </div>

    <main x-show="!loading && !error && availableDates.length > 0">

      <!-- 日期導覽 -->
      <div class="archive-nav">
        <button @click="goPrev()" :disabled="!hasPrev">← 前一日</button>
        <select x-model="selectedDate" @change="loadDate()">
          <template x-for="d in availableDates" :key="d">
            <option :value="d" x-text="displayDateFor(d)"></option>
          </template>
        </select>
        <button @click="goNext()" :disabled="!hasNext">後一日 →</button>
      </div>
      <p style="margin:-1rem 0 2rem;color:var(--ink-soft);font-size:0.85rem">
        目前共 <strong x-text="availableDates.length" style="color:var(--ink)"></strong> 天的封存
        <span x-show="items.length > 0">· 本日 <strong x-text="items.length" style="color:var(--ink)"></strong> 則</span>
      </p>

      <!-- 該日無內容 -->
      <div x-show="items.length === 0" class="state-box">本日無內容</div>

      <!-- AI新視野（置頂） -->
      <section x-show="sharyVoice" style="margin-bottom:3rem">
        <div class="shary-block">
          <span class="label">AI 新視野</span>
          <p x-text="sharyVoice"></p>
          <footer>
            <span>Shary｜<a href="https://www.videomaker.cc" target="_blank" rel="noopener">影音創客</a>創辦人</span>
            <img class="shary-avatar" src="assets/shary.jpg" alt="Shary"
                 onerror="this.outerHTML='<div class=&quot;shary-avatar-fallback&quot;>S</div>'">
          </footer>
        </div>
      </section>

      <!-- Top 3 -->
      <section x-show="topThree.length > 0" style="margin-bottom:3rem">
        <div class="section-title">
          <h2>🚀 三大戰情點</h2>
        </div>
        <div class="hero-grid">
          <template x-for="item in topThree" :key="item.id">
            <article class="news-card">
              <span class="score-badge" x-text="'★ ' + item.score.toFixed(1)"></span>
              <div class="news-card-body">
                <div class="date-stamp">
                  <span class="day" x-text="ds(item.date).day"></span>
                  <span class="month" x-text="ds(item.date).month"></span>
                </div>
                <div class="news-card-content">
                  <span class="news-card-category" :class="categoryClass(item.category)" x-text="item.category"></span>
                  <h3 class="news-card-title" x-text="item.title"></h3>
                  <p class="news-card-desc" x-text="item.one_line"></p>
                  <p class="news-card-desc" style="margin-top:0.5rem" x-text="item.key_takeaway"></p>
                </div>
              </div>
              <div class="news-card-actions">
                <a class="read-more" :href="item.source_url" target="_blank" rel="noopener">原文 →</a>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- 趨勢。商業。創新 -->
      <section x-show="others.length > 0" style="margin-bottom:3rem">
        <div class="section-title">
          <h2>🛠️ 趨勢。商業。創新</h2>
          <span class="count" x-text="others.length + ' 則'"></span>
        </div>
        <div class="news-grid">
          <template x-for="item in others" :key="item.id">
            <article class="news-card">
              <div class="news-card-body">
                <div class="date-stamp">
                  <span class="day" x-text="ds(item.date).day"></span>
                  <span class="month" x-text="ds(item.date).month"></span>
                </div>
                <div class="news-card-content">
                  <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem">
                    <span class="news-card-category" :class="categoryClass(item.category)" style="margin:0" x-text="item.category"></span>
                    <span style="font-size:0.75rem;color:var(--brand-yellow-dark);font-weight:800" x-text="'★' + item.score.toFixed(1)"></span>
                  </div>
                  <h3 class="news-card-title" style="font-size:1rem" x-text="item.title"></h3>
                  <p class="news-card-desc" style="margin-top:0.35rem" x-text="item.key_takeaway"></p>
                </div>
              </div>
              <div class="news-card-actions">
                <a class="read-more" :href="item.source_url" target="_blank" rel="noopener">原文 →</a>
              </div>
            </article>
          </template>

          <!-- 每日金句卡（依當天日期輪替） -->
          <div class="quote-card" x-show="quote"
               :style="(quote && !photoErr) ? `--bgphoto:url('assets/quotes/${quote.id}.jpg')` : ''">
            <span class="badge">每日 AI 金句</span>
            <p class="quote-zh" x-text="quote && quote.zh"></p>
            <p class="quote-en" x-text="quote && quote.en"></p>
            <div class="quote-author">
              <img class="quote-photo" x-show="quote && !photoErr"
                   :src="'assets/quotes/' + (quote ? quote.id : '') + '.jpg'"
                   :alt="quote ? quote.author : ''" @error="photoErr = true">
              <div class="quote-photo" x-show="photoErr"
                   :style="`background:${quote ? quote.color : '#444'}`"
                   x-text="quote && quote.initials"></div>
              <div class="meta">
                <span class="name" x-text="quote && quote.author"></span>
                <span class="role" x-text="quote && quote.title"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- AI 製片實戰 -->
      <section x-show="studioItems.length > 0" style="margin-bottom:3rem">
        <div class="section-title">
          <h2>🎬 AI 製片實戰</h2>
          <span class="count">工具 × 工作流｜<span x-text="studioItems.length"></span> 則</span>
        </div>
        <div class="studio-grid">
          <template x-for="item in studioItems" :key="item.id">
            <article class="studio-card">
              <span class="platform" :style="`background:${pf(item.platform).color}`">
                <span class="pf-icon" x-text="pf(item.platform).icon"></span>
                <span x-text="pf(item.platform).label"></span>
              </span>
              <span class="angle" x-show="item.angle" x-text="item.angle"></span>
              <h3 class="studio-title" x-text="item.title"></h3>
              <p class="studio-desc" x-text="item.summary"></p>
              <div class="studio-foot">
                <span class="creator" x-text="item.creator"></span>
                <a class="studio-link" :href="item.source_url" target="_blank" rel="noopener">看原文 →</a>
              </div>
            </article>
          </template>
        </div>
      </section>

    </main>
  </div>

  <script>document.write(renderFooter());</script>

  <script>
    function archiveApp() {
      return {
        loading: true,
        error: null,
        allNews: [],
        allShary: [],
        availableDates: [],
        selectedDate: '',
        items: [],
        sharyVoice: '',
        allStudio: [],
        studioItems: [],
        quote: null,
        photoErr: false,
        categoryClass,
        categoryEmoji,
        pf: platformMeta,
        ds: dateStampParts,
        displayDateFor: displayDate,

        get topThree() {
          const flagged = this.items
            .filter(i => String(i.is_top).toLowerCase() === 'true' || i.is_top === true)
            .sort((a, b) => b.score - a.score);
          if (flagged.length > 0) return flagged.slice(0, 3);
          return this.items.slice().sort((a, b) => b.score - a.score).slice(0, 3);
        },
        get others() {
          const topIds = new Set(this.topThree.map(i => i.id));
          return this.items.filter(i => !topIds.has(i.id))
            .sort((a, b) => b.score - a.score);
        },
        get hasPrev() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          return idx >= 0 && idx < this.availableDates.length - 1;
        },
        get hasNext() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          return idx > 0;
        },

        async init() {
          this.loading = true;
          this.error = null;
          try {
            const [news, shary] = await Promise.all([
              fetchSheet(AI_NEWS_CONFIG.SHEETS.NEWS),
              fetchSheet(AI_NEWS_CONFIG.SHEETS.SHARY)
            ]);
            this.allNews = news;
            this.allShary = shary;
            // studio 獨立載入，失敗不影響主內容
            try { this.allStudio = await fetchSheet(AI_NEWS_CONFIG.SHEETS.STUDIO); }
            catch (e) { console.warn('studio 載入略過:', e.message); }
            const dateSet = new Set(news.map(n => n.date).filter(Boolean));
            this.availableDates = [...dateSet].sort((a, b) => b.localeCompare(a));
            const hashDate = (location.hash || '').replace('#', '');
            if (hashDate && this.availableDates.includes(hashDate)) {
              this.selectedDate = hashDate;
            } else if (this.availableDates.length > 0) {
              this.selectedDate = this.availableDates[0];
            }
            this.loadDate();
          } catch (err) {
            console.error(err);
            this.error = err.message || '未知錯誤';
          } finally {
            this.loading = false;
          }
        },
        loadDate() {
          this.items = this.allNews.filter(n => n.date === this.selectedDate);
          const s = this.allShary.find(s => s.date === this.selectedDate);
          this.sharyVoice = s ? s.content : '';
          this.studioItems = this.allStudio.filter(i => i.date === this.selectedDate).slice(0, 3);
          this.photoErr = false;
          this.quote = getDailyQuote(this.selectedDate);  // 依當天日期輪替金句
          history.replaceState(null, '', '#' + this.selectedDate);
        },
        goPrev() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          if (idx >= 0 && idx < this.availableDates.length - 1) {
            this.selectedDate = this.availableDates[idx + 1];
            this.loadDate();
          }
        },
        goNext() {
          const idx = this.availableDates.indexOf(this.selectedDate);
          if (idx > 0) {
            this.selectedDate = this.availableDates[idx - 1];
            this.loadDate();
          }
        }
      };
    }
  </script>
</body>
</html>
