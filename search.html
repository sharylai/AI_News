<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搜尋｜AI News</title>

  <link rel="stylesheet" href="assets/style.css?v=20260605e">
  <script src="assets/common.js?v=20260605e"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>
</head>

<body>

  <script>document.write(renderHeader('search'));</script>

  <div x-data="searchApp()" x-init="init()" x-cloak class="container">

    <div style="margin-bottom:2rem">
      <h1 style="margin:0;font-size:2rem;font-weight:900;letter-spacing:-0.02em">搜尋 AI 影音情報</h1>
      <p style="margin:0.35rem 0 0;color:var(--ink-soft);font-size:0.9rem">在所有歷史內容中查找工具、案例與關鍵字</p>
    </div>

    <div x-show="loading" class="state-box">
      <div class="spinner"></div>
      <p style="margin-top:0.85rem;font-size:0.875rem">索引建立中⋯⋯</p>
    </div>

    <div x-show="error" class="error-box">
      <p style="margin:0" x-text="error"></p>
    </div>

    <main x-show="!loading && !error">

      <!-- 搜尋區塊 -->
      <div style="background:var(--paper);border:1px solid var(--line);border-radius:0.75rem;padding:1.25rem;margin-bottom:1.5rem;position:sticky;top:0.5rem;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,0.04)">

        <!-- 搜尋列 -->
        <div class="search-pill">
          <input type="search" x-model="query" @input="runSearch()"
                 placeholder="搜尋工具名稱、關鍵字（如：Runway、虛擬人、合規）" />
          <button class="search-pill-btn" aria-label="搜尋">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.5">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>

        <!-- 分類 -->
        <div class="filter-row">
          <span class="label">分類：</span>
          <template x-for="cat in ['全部','工具','案例','教學','情報']" :key="cat">
            <button class="filter-chip" :class="selectedCategory === cat ? 'active' : ''"
                    @click="selectedCategory = cat; runSearch()" x-text="cat"></button>
          </template>
        </div>

        <!-- 可信度 -->
        <div class="filter-row">
          <span class="label">可信度：</span>
          <template x-for="cred in ['全部','A','B','C','D']" :key="cred">
            <button class="filter-chip" :class="selectedCred === cred ? 'active' : ''"
                    @click="selectedCred = cred; runSearch()" x-text="cred"></button>
          </template>
        </div>

        <!-- 熱門標籤 -->
        <div class="filter-row" x-show="topTags.length > 0">
          <span class="label">熱門標籤：</span>
          <template x-for="tag in topTags" :key="tag">
            <button class="filter-chip tag" :class="activeTags.includes(tag) ? 'active' : ''"
                    @click="toggleTag(tag)" x-text="'#' + tag"></button>
          </template>
        </div>

        <!-- 統計 + 重置 -->
        <div style="margin-top:0.75rem;display:flex;align-items:center;justify-content:space-between;font-size:0.8rem;color:var(--ink-soft)">
          <span>找到 <strong style="color:var(--ink)" x-text="results.length"></strong> 筆 / 共 <span x-text="allItems.length"></span> 筆</span>
          <button x-show="hasFilter" @click="resetFilters()"
                  style="background:none;border:0;color:var(--brand-yellow-dark);cursor:pointer;font-weight:700">
            清除所有條件
          </button>
        </div>
      </div>

      <!-- Empty -->
      <div x-show="results.length === 0" class="state-box">
        <p class="emoji">🔍</p>
        <span x-show="query || hasFilter">沒有符合條件的結果</span>
        <span x-show="!query && !hasFilter">輸入關鍵字或選擇標籤開始搜尋</span>
      </div>

      <!-- 結果 -->
      <div class="search-results" x-show="results.length > 0">
        <template x-for="item in results.slice(0, 50)" :key="item.id">
          <article class="news-card">
            <div class="news-card-body">
              <div class="date-stamp">
                <span class="day" x-text="ds(item.date).day"></span>
                <span class="month" x-text="ds(item.date).month"></span>
              </div>
              <div class="news-card-content">
                <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;flex-wrap:wrap">
                  <span class="news-card-category" :class="categoryClass(item.category)" style="margin:0" x-text="item.category"></span>
                  <span style="font-size:0.7rem;color:var(--ink-soft)" x-text="item.date"></span>
                  <span style="font-size:0.75rem;color:var(--brand-yellow-dark);font-weight:800" x-text="'★' + (item.score || 0).toFixed(1)"></span>
                  <span style="font-size:0.7rem;color:var(--ink-soft)" x-text="'[' + item.credibility + ']'"></span>
                </div>
                <h3 class="news-card-title" style="font-size:1rem" x-html="highlight(item.title)"></h3>
                <p class="news-card-desc" x-html="highlight(item.one_line || '')"></p>
              </div>
            </div>
            <div class="news-card-actions">
              <div class="news-card-tags">
                <template x-for="tag in itemTags(item)" :key="tag">
                  <span @click.prevent="toggleTag(tag)" style="cursor:pointer" x-text="'#' + tag"></span>
                </template>
              </div>
              <a class="read-more" :href="item.source_url" target="_blank" rel="noopener">原文 →</a>
            </div>
          </article>
        </template>
      </div>

      <p x-show="results.length > 50" style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:var(--ink-soft)">
        僅顯示前 50 筆，請縮小範圍以查看更多結果
      </p>

    </main>
  </div>

  <script>document.write(renderFooter());</script>

  <script>
    function searchApp() {
      return {
        loading: true,
        error: null,
        allItems: [],
        fuse: null,
        query: '',
        selectedCategory: '全部',
        selectedCred: '全部',
        activeTags: [],
        topTags: [],
        results: [],
        categoryClass,
        ds: dateStampParts,

        get hasFilter() {
          return this.query || this.selectedCategory !== '全部' ||
                 this.selectedCred !== '全部' || this.activeTags.length > 0;
        },

        async init() {
          this.loading = true;
          try {
            const news = await fetchSheet(AI_NEWS_CONFIG.SHEETS.NEWS);
            this.allItems = news.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            this.fuse = new Fuse(this.allItems, {
              keys: [
                { name: 'title', weight: 3 },
                { name: 'tags', weight: 2 },
                { name: 'company', weight: 2 },
                { name: 'one_line', weight: 1.5 },
                { name: 'key_takeaway', weight: 1 }
              ],
              threshold: 0.4, ignoreLocation: true, includeScore: true
            });
            this.computeTopTags();
            this.parseUrlParams();
            this.runSearch();
          } catch (err) {
            console.error(err);
            this.error = err.message || '未知錯誤';
          } finally {
            this.loading = false;
          }
        },

        computeTopTags() {
          const counts = {};
          this.allItems.forEach(item => {
            (item.tags || '').split(',').map(t => t.trim()).filter(Boolean).forEach(tag => {
              counts[tag] = (counts[tag] || 0) + 1;
            });
          });
          this.topTags = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([t]) => t);
        },

        parseUrlParams() {
          const params = new URLSearchParams(location.search);
          if (params.has('q')) this.query = params.get('q');
          if (params.has('cat')) this.selectedCategory = params.get('cat');
          if (params.has('tag')) this.activeTags = params.get('tag').split(',').filter(Boolean);
        },

        updateUrl() {
          const params = new URLSearchParams();
          if (this.query) params.set('q', this.query);
          if (this.selectedCategory !== '全部') params.set('cat', this.selectedCategory);
          if (this.activeTags.length > 0) params.set('tag', this.activeTags.join(','));
          const qs = params.toString();
          history.replaceState(null, '', qs ? '?' + qs : location.pathname);
        },

        runSearch() {
          let pool = this.allItems;
          if (this.query.trim()) {
            pool = this.fuse.search(this.query.trim()).map(r => r.item);
          }
          if (this.selectedCategory !== '全部') pool = pool.filter(i => i.category === this.selectedCategory);
          if (this.selectedCred !== '全部') pool = pool.filter(i => i.credibility === this.selectedCred);
          if (this.activeTags.length > 0) {
            pool = pool.filter(i => {
              const tags = (i.tags || '').split(',').map(t => t.trim());
              return this.activeTags.every(t => tags.includes(t));
            });
          }
          this.results = pool;
          this.updateUrl();
        },

        toggleTag(tag) {
          this.activeTags = this.activeTags.includes(tag)
            ? this.activeTags.filter(t => t !== tag) : [...this.activeTags, tag];
          this.runSearch();
        },

        resetFilters() {
          this.query = ''; this.selectedCategory = '全部'; this.selectedCred = '全部';
          this.activeTags = []; this.runSearch();
        },

        itemTags(item) {
          return (item.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 5);
        },

        highlight(text) {
          if (!text) return '';
          const safe = String(text).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
          if (!this.query.trim()) return safe;
          const terms = this.query.trim().split(/\s+/).filter(t => t.length > 0);
          let result = safe;
          terms.forEach(t => {
            const escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            result = result.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
          });
          return result;
        }
      };
    }
  </script>
</body>
</html>
