<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI News｜每日 8 點，AI 影音趨勢雷達</title>
  <meta name="description" content="每天 8 點，把全球 AI 影音情報轉化為立刻可用的創作靈感與商業行動。" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/common.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    body { font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    .prose-cn { line-height: 1.8; letter-spacing: 0.02em; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!--
    使用前請設定下列兩個常數：
    1. SHEET_ID:    Google Sheets 的 ID（網址中 /d/ 與 /edit 之間那段）
    2. Sheet 必須「知道連結的任何人皆可檢視」
  -->

  <div x-data="newsApp()" x-init="init()" x-cloak class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">

    <!-- Header -->
    <header class="border-b border-slate-200 pb-6 mb-8">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">
          AI News
          <span class="block text-sm font-normal text-slate-500 mt-1">每日 8 點，AI 影音趨勢雷達</span>
        </h1>
        <nav class="flex gap-3 text-sm">
          <a href="archive.html" class="text-slate-600 hover:text-slate-900">歷史</a>
          <a href="search.html" class="text-slate-600 hover:text-slate-900">搜尋</a>
        </nav>
      </div>
      <p class="mt-4 text-sm text-slate-500">
        <span x-text="displayDate"></span>
        <span x-show="lastUpdated" class="ml-2">· 更新於 <span x-text="lastUpdated"></span></span>
      </p>
    </header>

    <!-- Loading -->
    <div x-show="loading" class="py-20 text-center text-slate-400">
      <div class="inline-block w-6 h-6 border-2 border-slate-300 border-t-slate-700 rounded-full animate-spin"></div>
      <p class="mt-3 text-sm">載入中⋯⋯</p>
    </div>

    <!-- Error -->
    <div x-show="error" class="py-12 px-6 bg-red-50 border border-red-200 rounded-lg">
      <h2 class="font-semibold text-red-800">資料載入失敗</h2>
      <p class="mt-2 text-sm text-red-700" x-text="error"></p>
      <button @click="init()" class="mt-4 text-sm px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">重試</button>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && !error && items.length === 0" class="py-16 text-center">
      <p class="text-5xl mb-4">😴</p>
      <h2 class="text-lg font-semibold text-slate-700">今日無重大情報</h2>
      <p class="mt-2 text-sm text-slate-500">Pipeline 已運作，但今日符合條件的內容未達門檻。</p>
      <a href="archive.html" class="inline-block mt-6 text-sm text-blue-600 hover:underline">瀏覽歷史 →</a>
    </div>

    <!-- Main Content -->
    <main x-show="!loading && !error && items.length > 0" class="space-y-12">

      <!-- 三大戰情點 -->
      <section x-show="topThree.length > 0">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>🚀</span><span>今日三大戰情點</span>
        </h2>
        <div class="space-y-4">
          <template x-for="item in topThree" :key="item.id">
            <article class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm hover:shadow-md transition">
              <div class="flex items-start justify-between gap-3 mb-3">
                <h3 class="font-bold text-lg leading-snug">
                  <span class="inline-block text-xs font-medium px-2 py-0.5 rounded mr-2 align-middle"
                        :class="categoryClass(item.category)"
                        x-text="`【${item.category}】`"></span>
                  <span x-text="item.title"></span>
                </h3>
                <span class="shrink-0 text-xs text-amber-600 font-semibold" x-text="'★ ' + item.score.toFixed(1)"></span>
              </div>

              <dl class="prose-cn text-sm space-y-2 text-slate-700">
                <div>
                  <dt class="inline font-semibold text-slate-900">一秒看懂：</dt>
                  <dd class="inline" x-text="item.one_line"></dd>
                </div>
                <div>
                  <dt class="inline font-semibold text-slate-900">為什麼重要：</dt>
                  <dd class="inline" x-text="item.key_takeaway"></dd>
                </div>
                <div>
                  <dt class="inline font-semibold text-slate-900">今日行動：</dt>
                  <dd class="inline" x-text="item.actionable"></dd>
                </div>
              </dl>

              <div class="mt-4 flex items-center justify-between text-xs text-slate-500">
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="tag in (item.tags || '').split(',').map(t => t.trim()).filter(Boolean)" :key="tag">
                    <span class="px-2 py-0.5 bg-slate-100 rounded" x-text="'#' + tag"></span>
                  </template>
                </div>
                <a :href="item.source_url" target="_blank" rel="noopener" class="text-blue-600 hover:underline shrink-0 ml-2">
                  原文 →
                </a>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- 快報 Top 5 -->
      <section x-show="topFive.length > 0">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>🛠️</span><span>工具 & 案例快報</span>
        </h2>
        <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
          <template x-for="(item, idx) in topFive" :key="item.id">
            <details class="border-b border-slate-100 last:border-b-0 group">
              <summary class="px-5 py-4 cursor-pointer hover:bg-slate-50 flex items-center gap-3">
                <span class="text-xs font-medium px-2 py-0.5 rounded shrink-0"
                      :class="categoryClass(item.category)"
                      x-text="item.category"></span>
                <span class="font-medium text-sm flex-1 truncate" x-text="item.title"></span>
                <span class="text-xs text-amber-600 shrink-0" x-text="'★' + item.score.toFixed(1)"></span>
                <svg class="w-4 h-4 text-slate-400 transition-transform group-open:rotate-180 shrink-0"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </summary>
              <div class="px-5 pb-4 prose-cn text-sm text-slate-700 space-y-2">
                <p x-text="item.one_line"></p>
                <p class="text-slate-600" x-text="item.key_takeaway"></p>
                <p class="text-slate-900"><span class="font-semibold">行動建議：</span><span x-text="item.actionable"></span></p>
                <p class="text-xs text-slate-500 pt-1">
                  適合：<span x-text="item.audience"></span>
                  <a :href="item.source_url" target="_blank" rel="noopener" class="ml-3 text-blue-600 hover:underline">原文 →</a>
                </p>
              </div>
            </details>
          </template>
        </div>
      </section>

      <!-- 實戰教學 -->
      <section x-show="teachings.length > 0">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>💡</span><span>今日實戰教學</span>
        </h2>
        <div class="space-y-3">
          <template x-for="item in teachings" :key="item.id">
            <article class="bg-amber-50 border border-amber-200 rounded-xl p-5">
              <h3 class="font-bold text-base mb-2" x-text="item.title"></h3>
              <p class="prose-cn text-sm text-slate-700" x-text="item.key_takeaway"></p>
              <p class="mt-2 text-sm">
                <span class="font-semibold">立即試試：</span>
                <span x-text="item.actionable"></span>
              </p>
              <a :href="item.source_url" target="_blank" rel="noopener" class="text-xs text-blue-600 hover:underline">原文 →</a>
            </article>
          </template>
        </div>
      </section>

      <!-- Shary 觀點 -->
      <section x-show="sharyVoice">
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>✍️</span><span>Shary 觀點</span>
        </h2>
        <blockquote class="bg-slate-900 text-slate-100 rounded-xl p-6 sm:p-8 prose-cn leading-relaxed relative">
          <span class="absolute top-2 left-3 text-5xl text-slate-700 leading-none select-none">“</span>
          <p class="relative z-10" x-text="sharyVoice"></p>
          <footer class="mt-4 text-xs text-slate-400 text-right">— Shary｜影音創客創辦人</footer>
        </blockquote>
      </section>

      <!-- 完整連結庫 -->
      <section>
        <h2 class="text-xl font-bold mb-5 flex items-center gap-2">
          <span>🔗</span><span>今日完整連結庫</span>
        </h2>
        <ul class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 text-sm">
          <template x-for="item in items" :key="item.id">
            <li class="px-4 py-3 hover:bg-slate-50">
              <a :href="item.source_url" target="_blank" rel="noopener" class="flex items-start gap-3">
                <span class="text-xs text-slate-400 shrink-0 mt-0.5" x-text="item.category"></span>
                <span class="text-slate-800 truncate flex-1" x-text="item.title"></span>
                <span class="text-xs text-slate-400 shrink-0" x-text="'[' + item.credibility + ']'"></span>
              </a>
            </li>
          </template>
        </ul>
      </section>

    </main>

    <!-- Footer -->
    <footer class="mt-16 pt-6 border-t border-slate-200 text-xs text-slate-400 text-center">
      <p>AI News｜由 Claude API 自動生成，每日 06:00 更新</p>
      <p class="mt-1">內容僅供參考，原文連結為準</p>
    </footer>

  </div>

  <script>
    function newsApp() {
      return {
        loading: true,
        error: null,
        items: [],
        sharyVoice: '',
        lastUpdated: '',
        categoryClass,

        get todayDate() { return todayString(); },
        get displayDate() { return displayDate(this.todayDate); },

        get topThree() {
          return this.items
            .filter(i => String(i.is_top).toLowerCase() === 'true' || i.is_top === true)
            .sort((a, b) => b.score - a.score)
            .slice(0, 3);
        },

        get topFive() {
          const topIds = new Set(this.topThree.map(i => i.id));
          return this.items
            .filter(i => !topIds.has(i.id) && i.category !== '教學')
            .sort((a, b) => b.score - a.score)
            .slice(0, 5);
        },

        get teachings() {
          return this.items
            .filter(i => i.category === '教學')
            .sort((a, b) => b.score - a.score)
            .slice(0, 3);
        },

        async init() {
          this.loading = true;
          this.error = null;
          try {
            const [news, shary] = await Promise.all([
              fetchSheet(AI_NEWS_CONFIG.SHEETS.NEWS),
              fetchSheet(AI_NEWS_CONFIG.SHEETS.SHARY)
            ]);
            this.items = news.filter(i => i.date === this.todayDate);
            const todayShary = shary.find(s => s.date === this.todayDate);
            this.sharyVoice = todayShary ? todayShary.content : '';

            if (this.items.length > 0) {
              const latest = this.items.reduce((max, i) =>
                (i.created_at > max ? i.created_at : max), '');
              this.lastUpdated = formatTime(latest);
            }
          } catch (err) {
            console.error(err);
            this.error = err.message || '未知錯誤';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>

</body>
</html>
