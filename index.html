<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI News｜每日 8 點，AI 影音趨勢雷達</title>
  <meta name="description" content="每天 8 點，把全球 AI 影音情報轉化為立刻可用的創作靈感與商業行動。" />

  <link rel="stylesheet" href="assets/style.css?v=20260605d">
  <script src="assets/common.js?v=20260605d"></script>
  <script src="assets/quotes.js?v=20260605d"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>
</head>

<body>

  <script>document.write(renderHeader('today'));</script>

  <div x-data="newsApp()" x-init="init()" x-cloak class="container">

    <!-- 日期 & 副標 -->
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0.5rem;margin-bottom:2rem">
      <div>
        <h1 style="margin:0;font-size:2rem;font-weight:900;letter-spacing:-0.02em" x-text="fellBack ? 'AI 影音趨勢雷達' : '今日 AI 影音趨勢雷達'"></h1>
        <p style="margin:0.35rem 0 0;color:var(--ink-soft);font-size:0.9rem">
          <span x-text="displayDateStr"></span>
          <span x-show="fellBack" style="margin-left:0.5rem;background:var(--brand-yellow-light);color:#92400E;padding:0.1rem 0.5rem;border-radius:0.25rem;font-size:0.75rem;font-weight:700">最近更新</span>
          <span x-show="lastUpdated" style="margin-left:0.75rem">· 更新於 <span x-text="lastUpdated"></span></span>
        </p>
      </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="state-box">
      <div class="spinner"></div>
      <p style="margin-top:0.85rem;font-size:0.875rem">載入中⋯⋯</p>
    </div>

    <!-- Error -->
    <div x-show="error" class="error-box">
      <h2 style="margin:0 0 0.5rem;font-size:1rem;font-weight:800">資料載入失敗</h2>
      <p style="margin:0;font-size:0.875rem" x-text="error"></p>
      <button @click="init()" style="margin-top:0.85rem;padding:0.5rem 1rem;background:#DC2626;color:#fff;border:0;border-radius:0.4rem;cursor:pointer;font-weight:700">重試</button>
    </div>

    <!-- Empty -->
    <div x-show="!loading && !error && items.length === 0" class="state-box">
      <p class="emoji">😴</p>
      <h2 style="font-size:1.1rem;font-weight:800;color:var(--ink)">今日無重大情報</h2>
      <p style="margin-top:0.4rem">Pipeline 已運作，但今日符合條件的內容未達門檻。</p>
      <a href="archive.html" style="display:inline-block;margin-top:1rem;color:var(--brand-yellow-dark);font-weight:700;text-decoration:none">瀏覽歷史 →</a>
    </div>

    <!-- 主內容 -->
    <main x-show="!loading && !error && items.length > 0">

      <!-- AI新視野（置頂） -->
      <section x-show="sharyVoice" style="margin-bottom:3rem">
        <div class="shary-block">
          <span class="label">AI 新視野</span>
          <p x-text="sharyVoice"></p>
          <footer>
            <span>Shary｜<a href="https://www.videomaker.cc" target="_blank" rel="noopener">影音創客</a>創辦人</span>
            <img class="shary-avatar" src="assets/shary.jpg" alt="Shary"
                 onerror="this.outerHTML='<div class=&quot;shary-avatar-fallback&quot;>S</div>'">
          </footer>
        </div>
      </section>

      <!-- 三大戰情點 -->
      <section x-show="topThree.length > 0" style="margin-bottom:3rem">
        <div class="section-title">
          <h2>🚀 今日三大戰情點</h2>
        </div>
        <div class="hero-grid">
          <template x-for="item in topThree" :key="item.id">
            <article class="news-card">
              <span class="score-badge" x-text="'★ ' + item.score.toFixed(1)"></span>
              <div class="news-card-body">
                <div class="date-stamp">
                  <span class="day" x-text="ds(item.date).day"></span>
                  <span class="month" x-text="ds(item.date).month"></span>
                </div>
                <div class="news-card-content">
                  <span class="news-card-category" :class="categoryClass(item.category)" x-text="item.category"></span>
                  <h3 class="news-card-title" x-text="item.title"></h3>
                  <p class="news-card-desc" x-text="item.one_line"></p>
                  <p class="news-card-desc" style="margin-top:0.5rem" x-text="item.key_takeaway"></p>
                  <p style="margin:0.75rem 0 0;font-size:0.85rem;color:var(--ink);font-weight:600">
                    👉 <span x-text="item.actionable"></span>
                  </p>
                </div>
              </div>
              <div class="news-card-actions">
                <div class="news-card-tags">
                  <template x-for="tag in (item.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 3)" :key="tag">
                    <span x-text="'#' + tag"></span>
                  </template>
                </div>
                <a class="read-more" :href="item.source_url" target="_blank" rel="noopener">原文 →</a>
              </div>
            </article>
          </template>
        </div>
      </section>

      <!-- 工具 & 案例快報 -->
      <section x-show="restItems.length > 0" style="margin-bottom:3rem">
        <div class="section-title">
          <h2>🛠️ 工具 &amp; 案例快報</h2>
          <span class="count" x-text="restItems.length + ' 則'"></span>
        </div>
        <div class="news-grid">
          <template x-for="item in restItems" :key="item.id">
            <article class="news-card">
              <div class="news-card-body">
                <div class="date-stamp">
                  <span class="day" x-text="ds(item.date).day"></span>
                  <span class="month" x-text="ds(item.date).month"></span>
                </div>
                <div class="news-card-content">
                  <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem">
                    <span class="news-card-category" :class="categoryClass(item.category)" style="margin:0" x-text="item.category"></span>
                    <span style="font-size:0.75rem;color:var(--brand-yellow-dark);font-weight:800" x-text="'★' + item.score.toFixed(1)"></span>
                    <span style="font-size:0.7rem;color:var(--ink-soft)" x-text="'[' + item.credibility + ']'"></span>
                  </div>
                  <h3 class="news-card-title" style="font-size:1rem" x-text="item.title"></h3>
                  <p class="news-card-desc" x-text="item.one_line"></p>
                </div>
              </div>
              <div class="news-card-actions">
                <div class="news-card-tags">
                  <template x-for="tag in (item.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 2)" :key="tag">
                    <span x-text="'#' + tag"></span>
                  </template>
                </div>
                <a class="read-more" :href="item.source_url" target="_blank" rel="noopener">查看原文 →</a>
              </div>
            </article>
          </template>

          <!-- 每日金句卡（金句在上，左下角頭像貼近名字） -->
          <div class="quote-card" x-show="quote">
            <span class="badge">每日 AI 金句</span>
            <p class="quote-zh" x-text="quote && quote.zh"></p>
            <p class="quote-en" x-text="quote && quote.en"></p>
            <div class="quote-author">
              <!-- 頭像：有真實照片 assets/quotes/<id>.jpg 用照片，否則縮寫圓 -->
              <img class="quote-photo" x-show="quote && !photoErr"
                   :src="'assets/quotes/' + (quote ? quote.id : '') + '.jpg'"
                   :alt="quote ? quote.author : ''"
                   @error="photoErr = true">
              <div class="quote-photo" x-show="photoErr"
                   :style="`background:${quote ? quote.color : '#444'}`"
                   x-text="quote && quote.initials"></div>
              <div class="meta">
                <span class="name" x-text="quote && quote.author"></span>
                <span class="role" x-text="quote && quote.title"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 連結庫 -->
      <section style="margin-top:3rem">
        <div class="section-title">
          <h2>🔗 今日完整連結庫</h2>
          <span class="count" x-text="items.length + ' 則'"></span>
        </div>
        <div class="link-list">
          <template x-for="item in items" :key="item.id">
            <a :href="item.source_url" target="_blank" rel="noopener">
              <span class="cat" x-text="item.category"></span>
              <span class="title" x-text="item.title"></span>
              <span class="cred" x-text="'[' + item.credibility + ']'"></span>
            </a>
          </template>
        </div>
      </section>

    </main>
  </div>

  <script>document.write(renderFooter());</script>

  <script>
    function newsApp() {
      return {
        loading: true,
        error: null,
        items: [],
        sharyVoice: '',
        lastUpdated: '',
        displayedDate: '',         // 實際顯示的日期（可能 fallback）
        fellBack: false,           // 是否從今日 fallback 到最新一天
        quote: getDailyQuote(),    // 每日 AI 金句
        photoErr: false,           // 頭像照片載入失敗 → 改用縮寫圓
        categoryClass,
        categoryEmoji,
        ds: dateStampParts,

        get todayDate() { return todayString(); },
        get displayDateStr() { return displayDate(this.displayedDate || this.todayDate); },

        get topThree() {
          return this.items
            .filter(i => String(i.is_top).toLowerCase() === 'true' || i.is_top === true)
            .sort((a, b) => b.score - a.score)
            .slice(0, 3);
        },
        get restItems() {
          const topIds = new Set(this.topThree.map(i => i.id));
          return this.items
            .filter(i => !topIds.has(i.id))
            .sort((a, b) => b.score - a.score);
        },

        async init() {
          this.loading = true;
          this.error = null;
          try {
            const [news, shary] = await Promise.all([
              fetchSheet(AI_NEWS_CONFIG.SHEETS.NEWS),
              fetchSheet(AI_NEWS_CONFIG.SHEETS.SHARY)
            ]);

            // 嘗試今日；若無，回退到最新有資料的一天
            this.items = news.filter(i => i.date === this.todayDate);
            this.displayedDate = this.todayDate;
            if (this.items.length === 0) {
              const allDates = [...new Set(news.map(n => n.date).filter(Boolean))]
                .sort((a, b) => b.localeCompare(a));
              if (allDates.length > 0) {
                this.displayedDate = allDates[0];
                this.items = news.filter(i => i.date === this.displayedDate);
                this.fellBack = true;
              }
            }
            const dayShary = shary.find(s => s.date === this.displayedDate);
            this.sharyVoice = dayShary ? dayShary.content : '';
            if (this.items.length > 0) {
              const latest = this.items.reduce((max, i) =>
                (i.created_at > max ? i.created_at : max), '');
              this.lastUpdated = formatTime(latest);
            }
          } catch (err) {
            console.error(err);
            this.error = err.message || '未知錯誤';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
